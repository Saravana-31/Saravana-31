<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="SmartSpend AI architecture: React UI sends chat messages to a Flask API, which saves detected transactions to Firebase or forwards other messages to Groq">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#040912"/><stop offset="1" stop-color="#0a1830"/></linearGradient>
  <radialGradient id="glow" cx="600" cy="230" r="520" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#14294a" stroke-width="1" opacity="0.55"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#22d3ee"/></marker>
</defs>
<rect width="1200" height="460" fill="url(#bg)"/><rect width="1200" height="460" fill="url(#grid)"/><rect width="1200" height="460" fill="url(#glow)"/>
<text x="40" y="56" font-family="Space Grotesk, sans-serif" font-size="26" font-weight="700" fill="#e6f1ff" text-anchor="start" letter-spacing="-0.4">SmartSpend AI: how a chat message becomes a transaction</text>
<rect x="40" y="150" width="270" height="200" rx="14" fill="#0b1a33" stroke="#22d3ee" stroke-width="1.8"/><text x="60" y="186" font-family="Space Grotesk, sans-serif" font-size="19" font-weight="600" fill="#e6f1ff" text-anchor="start" >React + Vite UI</text><text x="60" y="212" font-family="Inter, sans-serif" font-size="13.5" font-weight="400" fill="#9fb3c8" text-anchor="start" >Chat, dashboard, budget planner</text><text x="60" y="231" font-family="Inter, sans-serif" font-size="13.5" font-weight="400" fill="#9fb3c8" text-anchor="start" >Bill scanner (Tesseract.js OCR)</text><text x="60" y="250" font-family="Inter, sans-serif" font-size="13.5" font-weight="400" fill="#9fb3c8" text-anchor="start" >Firebase Auth sign-in</text>
<rect x="470" y="150" width="300" height="200" rx="14" fill="#0b1a33" stroke="#22d3ee" stroke-width="1.8"/><text x="490" y="186" font-family="Space Grotesk, sans-serif" font-size="19" font-weight="600" fill="#e6f1ff" text-anchor="start" >Flask API  /api/chat</text><text x="490" y="212" font-family="Inter, sans-serif" font-size="13.5" font-weight="400" fill="#9fb3c8" text-anchor="start" >1. Regex patterns look for an income or</text><text x="490" y="231" font-family="Inter, sans-serif" font-size="13.5" font-weight="400" fill="#9fb3c8" text-anchor="start" >expense amount.</text><text x="490" y="250" font-family="Inter, sans-serif" font-size="13.5" font-weight="400" fill="#9fb3c8" text-anchor="start" >2. Keyword rules pick a category (Food,</text><text x="490" y="269" font-family="Inter, sans-serif" font-size="13.5" font-weight="400" fill="#9fb3c8" text-anchor="start" >Travel, Health, Investment, Other).</text>
<rect x="930" y="104" width="240" height="116" rx="14" fill="#0b1a33" stroke="#2a6ea0" stroke-width="1.2"/><text x="950" y="140" font-family="Space Grotesk, sans-serif" font-size="19" font-weight="600" fill="#e6f1ff" text-anchor="start" >Firebase Firestore</text><text x="950" y="166" font-family="Inter, sans-serif" font-size="13.5" font-weight="400" fill="#9fb3c8" text-anchor="start" >Saves the transaction and</text><text x="950" y="185" font-family="Inter, sans-serif" font-size="13.5" font-weight="400" fill="#9fb3c8" text-anchor="start" >updates the balance.</text>
<rect x="930" y="270" width="240" height="116" rx="14" fill="#0b1a33" stroke="#2a6ea0" stroke-width="1.2"/><text x="950" y="306" font-family="Space Grotesk, sans-serif" font-size="19" font-weight="600" fill="#e6f1ff" text-anchor="start" >Groq API</text><text x="950" y="332" font-family="Inter, sans-serif" font-size="13.5" font-weight="400" fill="#9fb3c8" text-anchor="start" >llama-3.1-8b-instant answers</text><text x="950" y="351" font-family="Inter, sans-serif" font-size="13.5" font-weight="400" fill="#9fb3c8" text-anchor="start" >all other messages.</text>
<line x1="314" y1="250" x2="466" y2="250" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/><text x="390" y="238" font-family="Inter, sans-serif" font-size="12.5" font-weight="500" fill="#9fb3c8" text-anchor="middle" >message + user id</text>
<line x1="774" y1="200" x2="926" y2="168" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/><text x="850" y="168" font-family="Inter, sans-serif" font-size="12.5" font-weight="500" fill="#9fb3c8" text-anchor="middle" >transaction found</text>
<line x1="774" y1="300" x2="926" y2="328" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/><text x="850" y="338" font-family="Inter, sans-serif" font-size="12.5" font-weight="500" fill="#9fb3c8" text-anchor="middle" >no transaction</text>
<path d="M175 148 V122 H926" fill="none" stroke="#60a5fa" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="550" y="112" font-family="Inter, sans-serif" font-size="12.5" font-weight="500" fill="#60a5fa" text-anchor="middle" >dashboard reads transactions directly</text>
<text x="40" y="410" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#6f8aa8" text-anchor="start" >Reply returns to the chat. Without a Groq key the API falls back to canned replies.</text>
<text x="40" y="434" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#6f8aa8" text-anchor="start" >Drawn from the repository code. This is a diagram, not a screenshot.</text>
</svg>